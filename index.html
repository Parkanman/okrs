<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мои цели</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #F0F4FF;
      --card: #FFFFFF;
      --primary: #4F46E5;
      --primary-dark: #3730A3;
      --health: #10B981;
      --health-light: #D1FAE5;
      --dev: #F59E0B;
      --dev-light: #FEF3C7;
      --text: #1E293B;
      --muted: #64748B;
      --border: #E2E8F0;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    .header {
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      color: white;
      padding: 36px 24px 28px;
      text-align: center;
    }

    .header-title {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .header-subtitle {
      font-size: 0.95rem;
      opacity: 0.75;
      margin-bottom: 20px;
    }

    .countdown-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.15);
      border-radius: 100px;
      padding: 8px 20px;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .overall-wrap {
      max-width: 360px;
      margin: 0 auto;
    }

    .overall-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      opacity: 0.8;
      margin-bottom: 6px;
    }

    .overall-track {
      background: rgba(255,255,255,0.25);
      border-radius: 100px;
      height: 10px;
      overflow: hidden;
    }

    .overall-fill {
      height: 100%;
      background: white;
      border-radius: 100px;
      transition: width 1.2s cubic-bezier(.4,0,.2,1);
    }

    /* ── TABS ── */
    .tabs {
      display: flex;
      background: white;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .tab {
      flex: 1;
      padding: 14px 16px;
      text-align: center;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--muted);
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      user-select: none;
    }

    .tab:hover { color: var(--primary); }

    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    /* ── CONTENT ── */
    .content {
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── CHART CARD ── */
    .chart-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 16px;
    }

    /* ── CATEGORY ── */
    .category { margin-bottom: 28px; }

    .cat-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .cat-header.health { color: #059669; }
    .cat-header.dev { color: #D97706; }

    .cat-badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 100px;
    }

    .cat-badge.health { background: var(--health-light); color: #059669; }
    .cat-badge.dev { background: var(--dev-light); color: #D97706; }

    /* ── GOAL CARDS ── */
    .goals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .goal-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      position: relative;
      overflow: hidden;
    }

    .goal-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
    }

    .goal-card.health::before { background: var(--health); }
    .goal-card.dev::before { background: var(--dev); }

    .goal-name {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 3px;
    }

    .goal-desc {
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .progress-track {
      background: #F1F5F9;
      border-radius: 100px;
      height: 8px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 100px;
      min-width: 2px;
      transition: width 1.2s cubic-bezier(.4,0,.2,1);
    }

    .progress-fill.health { background: var(--health); }
    .progress-fill.dev { background: var(--dev); }

    .goal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .goal-pct {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text);
    }

    .done-badge {
      background: var(--health);
      color: white;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 100px;
    }

    /* ── QUOTE ── */
    .quote-card {
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      border-radius: var(--radius);
      padding: 28px 28px;
      color: white;
      text-align: center;
      margin-top: 8px;
    }

    .quote-icon {
      font-size: 1.8rem;
      margin-bottom: 12px;
      opacity: 0.8;
    }

    .quote-text {
      font-size: 1rem;
      line-height: 1.65;
      font-style: italic;
      margin-bottom: 12px;
      opacity: 0.95;
    }

    .quote-author {
      font-size: 0.8rem;
      opacity: 0.65;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ── MISSION TAB ── */
    .mission-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .mission-header-icon { font-size: 3rem; margin-bottom: 12px; }

    .mission-header-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
    }

    .mission-header-sub {
      font-size: 0.88rem;
      color: var(--muted);
    }

    .toast-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      margin-bottom: 20px;
    }

    .toast-author {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .toast-emoji { font-size: 1.6rem; }

    .toast-from {
      font-weight: 700;
      font-size: 1rem;
      color: var(--primary);
    }

    .toast-text {
      font-size: 0.95rem;
      line-height: 1.8;
      color: var(--text);
      white-space: pre-line;
    }

    .mission-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 40px 32px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      text-align: center;
    }

    .mission-icon { font-size: 3.5rem; margin-bottom: 20px; }

    .mission-title {
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 16px;
      color: var(--text);
    }

    .mission-text {
      font-size: 1.05rem;
      line-height: 1.75;
      color: var(--text);
      max-width: 560px;
      margin: 0 auto;
    }

    .mission-empty {
      color: #CBD5E1;
      font-style: italic;
      font-size: 0.95rem;
    }

    .mission-hint {
      margin-top: 24px;
      font-size: 0.8rem;
      color: var(--muted);
      background: #F8FAFC;
      border-radius: 10px;
      padding: 12px 16px;
      display: inline-block;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 500px) {
      .header-title { font-size: 1.4rem; }
      .goals-grid { grid-template-columns: 1fr; }
      .content { padding: 20px 12px 48px; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-title">Мои цели</div>
  <div class="header-subtitle">Июль — Сентябрь 2026</div>
  <div class="countdown-box">
    <span>⏳</span>
    <span id="countdown">...</span>
  </div>
  <div class="overall-wrap">
    <div class="overall-label">
      <span>Общий прогресс</span>
      <span id="overallPct">0%</span>
    </div>
    <div class="overall-track">
      <div class="overall-fill" id="overallFill" style="width:0%"></div>
    </div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('goals')">🎯 Цели</div>
  <div class="tab" onclick="switchTab('mission')">🌟 Миссия</div>
</div>

<div class="content">

  <!-- GOALS TAB -->
  <div class="tab-panel active" id="tab-goals">

    <div class="chart-card">
      <div class="section-label">Прогресс по целям</div>
      <canvas id="chart" height="220"></canvas>
    </div>

    <div id="goalsContainer"></div>

    <div class="quote-card">
      <div class="quote-icon">💬</div>
      <div class="quote-text" id="quoteText"></div>
      <div class="quote-author" id="quoteAuthor"></div>
    </div>

  </div>

  <!-- MISSION TAB -->
  <div class="tab-panel" id="tab-mission">
    <div class="mission-header">
      <div class="mission-header-icon">🌟</div>
      <div class="mission-header-title">Моя глобальная цель</div>
      <div class="mission-header-sub">Что скажут обо мне люди на моём 70-летнем юбилее</div>
    </div>
    <div id="toastsContainer"></div>
  </div>

</div>

<script>
  const QUOTES = [
    { text: "Дисциплина — это мост между целями и достижениями.", author: "Джим Рон" },
    { text: "Маленький прогресс каждый день приводит к большим результатам.", author: "Сатья Надела" },
    { text: "Цель без плана — просто мечта.", author: "Антуан де Сент-Экзюпери" },
    { text: "Вы не проигрываете, пока не перестаёте пробовать.", author: "Флоренс Гриффит-Джойнер" },
    { text: "Путь в тысячу миль начинается с первого шага.", author: "Лао-цзы" },
    { text: "Успех — это сумма маленьких усилий, повторяемых день за днём.", author: "Роберт Кольер" },
    { text: "Самое трудное — начать действовать. Всё остальное зависит только от упорства.", author: "Амелия Эрхарт" },
    { text: "Не смотри на часы — делай то, что они делают. Продолжай двигаться.", author: "Сэм Левенсон" },
    { text: "Победитель — это просто мечтатель, который никогда не сдался.", author: "Нельсон Мандела" },
    { text: "Сделай сегодня то, что другие не хотят, — завтра будешь жить так, как другие не могут.", author: "Джаред Leto" },
  ];

  function switchTab(name) {
    document.querySelectorAll('.tab').forEach((t, i) => {
      t.classList.toggle('active', i === (name === 'goals' ? 0 : 1));
    });
    document.querySelectorAll('.tab-panel').forEach(p => {
      p.classList.toggle('active', p.id === 'tab-' + name);
    });
  }

  function calcPct(g) {
    if (g.direction === 'down') {
      const total = g.start - g.target;
      if (total <= 0) return 100;
      return Math.min(100, Math.max(0, ((g.start - g.current) / total) * 100));
    }
    if (g.target === 0) return 100;
    return Math.min(100, Math.max(0, (g.current / g.target) * 100));
  }

  function pluralDays(n) {
    const abs = Math.abs(n);
    if (abs % 10 === 1 && abs % 100 !== 11) return 'день';
    if ([2,3,4].includes(abs % 10) && ![12,13,14].includes(abs % 100)) return 'дня';
    return 'дней';
  }

  function goalCard(g, cls) {
    const pct = calcPct(g);
    const done = pct >= 100;

    let statsLeft;
    if (g.direction === 'down') {
      statsLeft = `${g.current} ${g.unit} → цель ${g.target} ${g.unit}`;
    } else {
      statsLeft = `${g.current} / ${g.target} ${g.unit}`;
    }

    const rightEl = done
      ? `<span class="done-badge">✓ Готово</span>`
      : `<span class="goal-pct">${pct.toFixed(0)}%</span>`;

    return `
      <div class="goal-card ${cls}">
        <div class="goal-name">${g.name}</div>
        <div class="goal-desc">${g.description}</div>
        <div class="progress-track">
          <div class="progress-fill ${cls}" style="width:${pct}%"></div>
        </div>
        <div class="goal-footer">
          <span>${statsLeft}</span>
          ${rightEl}
        </div>
      </div>`;
  }

  function render(data) {
    // Countdown
    const deadline = new Date(data.deadline);
    const now = new Date();
    const days = Math.ceil((deadline - now) / 86400000);
    const countdownEl = document.getElementById('countdown');
    if (days > 0) {
      countdownEl.textContent = `Осталось ${days} ${pluralDays(days)}`;
    } else if (days === 0) {
      countdownEl.textContent = 'Последний день!';
    } else {
      countdownEl.textContent = `Закончилось ${Math.abs(days)} ${pluralDays(days)} назад`;
    }

    // Overall progress
    const pcts = data.goals.map(calcPct);
    const overall = pcts.reduce((a, b) => a + b, 0) / pcts.length;
    document.getElementById('overallFill').style.width = overall.toFixed(1) + '%';
    document.getElementById('overallPct').textContent = overall.toFixed(0) + '%';

    // Category configs
    const cats = {
      'Здоровье': { emoji: '💪', cls: 'health' },
      'Развитие':  { emoji: '📚', cls: 'dev' },
    };

    // Group goals
    const grouped = {};
    data.goals.forEach(g => {
      if (!grouped[g.category]) grouped[g.category] = [];
      grouped[g.category].push(g);
    });

    // Render goal cards
    const container = document.getElementById('goalsContainer');
    Object.entries(grouped).forEach(([cat, goals]) => {
      const cfg = cats[cat] || { emoji: '🎯', cls: 'health' };
      const count = goals.length;
      const div = document.createElement('div');
      div.className = 'category';
      div.innerHTML = `
        <div class="cat-header ${cfg.cls}">
          ${cfg.emoji} ${cat}
          <span class="cat-badge ${cfg.cls}">${count} цел${count === 1 ? 'ь' : 'и'}</span>
        </div>
        <div class="goals-grid">
          ${goals.map(g => goalCard(g, cfg.cls)).join('')}
        </div>`;
      container.appendChild(div);
    });

    // Bar chart
    const labels = data.goals.map(g => g.name);
    const values = data.goals.map(calcPct);
    const colors = data.goals.map(g =>
      g.category === 'Здоровье' ? '#10B981' : '#F59E0B'
    );

    new Chart(document.getElementById('chart'), {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          data: values,
          backgroundColor: colors,
          borderRadius: 6,
          borderSkipped: false,
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => ` ${ctx.parsed.x.toFixed(0)}%`
            }
          }
        },
        scales: {
          x: {
            min: 0, max: 100,
            ticks: { callback: v => v + '%', font: { size: 11 } },
            grid: { color: '#F1F5F9' }
          },
          y: {
            ticks: { font: { size: 12 } },
            grid: { display: false }
          }
        }
      }
    });

    // Random quote
    const q = QUOTES[Math.floor((Date.now() / 86400000)) % QUOTES.length];
    document.getElementById('quoteText').textContent = `"${q.text}"`;
    document.getElementById('quoteAuthor').textContent = `— ${q.author}`;

    // Mission toasts
    const toastsEl = document.getElementById('toastsContainer');
    const toasts = data.mission && data.mission.toasts;
    if (toasts && toasts.length > 0) {
      toastsEl.innerHTML = toasts.map(t => `
        <div class="toast-card">
          <div class="toast-author">
            <span class="toast-emoji">${t.emoji}</span>
            <span class="toast-from">${t.from}</span>
          </div>
          <div class="toast-text">${t.text}</div>
        </div>`).join('');
    } else {
      toastsEl.innerHTML = `
        <div class="mission-card">
          <div class="mission-icon">🌟</div>
          <div class="mission-title">Пока пусто</div>
          <div class="mission-text mission-empty">Тосты появятся здесь по мере добавления в data.json</div>
        </div>`;
    }
  }

  fetch('data.json')
    .then(r => r.json())
    .then(render)
    .catch(err => {
      document.getElementById('goalsContainer').innerHTML =
        '<p style="color:#EF4444;padding:20px">Ошибка загрузки данных. Проверь data.json</p>';
      console.error(err);
    });
</script>

</body>
</html>
